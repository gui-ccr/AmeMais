<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e5e5e5;font-family:'Inter',system-ui,sans-serif}
a{color:#0d99ff}a:hover{color:#0b7fd4}
</style>
</helmet>

<div style="padding:48px 56px;display:flex;flex-direction:column;gap:24px">

  <div style="display:flex;align-items:center;gap:12px">
    <div style="background:#1e1e1e;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600">AmeMais — Todas as telas</div>
    <div style="font-size:12px;color:#777">7 páginas · desktop 1280 + mobile 390 · pronto para print</div>
  </div>

  <div style="display:flex;gap:96px;align-items:flex-start">
  <sc-for list="{{ telas }}" as="t" hint-placeholder-count="7">
    <div data-screen-label="{{ t.nome }}" style="display:flex;flex-direction:column;gap:10px;flex:none">
      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-size:14px;font-weight:600;color:#333"># {{ t.nome }}</span>
      </div>
      <div style="display:flex;gap:48px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:11px;color:#999">{{ t.nome }} / Desktop — 1280</span>
          <div style="width:1280px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:4px;overflow:hidden">
            <dc-import name="Site AmeMais" tela-inicial="{{ t.id }}" hint-size="1280px,900px"></dc-import>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:11px;color:#999">{{ t.nome }} / Mobile — 390</span>
          <div style="width:390px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:4px;overflow:hidden">
            <dc-import name="Site AmeMais" tela-inicial="{{ t.id }}" hint-size="390px,900px"></dc-import>
          </div>
        </div>
      </div>
    </div>
  </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      telas: [
        { id: 'inicio', nome: 'Home' },
        { id: 'adote', nome: 'Adote um Amigo' },
        { id: 'doe', nome: 'Central de Ajuda / Doe' },
        { id: 'acoes', nome: 'Mural de Ações' },
        { id: 'sobre', nome: 'Sobre' },
        { id: 'voluntario', nome: 'Seja Voluntário' },
        { id: 'contato', nome: 'Contato' },
      ],
    };
  }
}
</script>
</body>
</html>
